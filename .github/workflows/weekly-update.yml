name: Atualização Semanal do Plano Alimentar

on:
  schedule:
    # toda segunda-feira às 09:00 UTC = 06:00 no horário de Brasília
    - cron: '0 9 * * 1'
  workflow_dispatch: {}   # permite rodar manualmente pela aba "Actions" também

permissions:
  contents: write
  id-token: write

jobs:
  atualizar-cardapio:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Pedir para o Claude Code gerar a nova semana
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Você vai atualizar o cardápio semanal do site em data/current-week.json.

            REGRAS OBRIGATÓRIAS:
            1. NUNCA edite index.html, nem nenhum arquivo CSS/JS de layout. Mexa só em arquivos dentro de data/ e historico/.
            2. Antes de sobrescrever, leia o data/current-week.json atual e copie ele, sem alterações, para
               historico/<AAAA-MM-DD>.json (use a data de hoje, formato ISO).
            3. Adicione uma entrada no início do array de historico/manifest.json com o formato:
               {"label": "<texto do weekLabel antigo>", "date": "<AAAA-MM-DD de hoje>", "file": "historico/<AAAA-MM-DD>.json"}
            4. Gere um NOVO data/current-week.json com a MESMA estrutura JSON (weekLabel, motivational, adults[7], kids[7],
               cada dia com meals: "Café da Manhã", "Almoço", "Lanche da Tarde", "Jantar", cada refeição com "txt" e "g"
               — o campo "g" é a gramatura sugerida por ingrediente, ex: "150g frango · 100g arroz · 80g feijão").
            5. As novas receitas devem usar SOMENTE ingredientes que aparecem em data/shopping.json (a lista de compras
               da família). Não introduza proteínas, carboidratos ou laticínios que não estejam nessa lista — o objetivo
               é manter o orçamento mensal estável. Pode variar o modo de preparo e as combinações livremente.
            6. Mantenha para os adultos: alto teor proteico (~150g de proteína por refeição principal), e para as
               crianças: porções menores (60-90g de proteína por refeição principal), pratos mais simples, e NUNCA
               inclua whey protein nas refeições das crianças.
            7. Escreva uma nova frase motivacional curta (1-2 frases, em português, tom acolhedor e realista, focada em
               saúde do corpo e consistência — nunca em peso, estética ou culpa) para o campo "motivational".
            8. Atualize "weekLabel" para refletir os próximos 7 dias a partir de hoje (ex: "17 a 23 de agosto").
            9. Garanta que todos os arquivos JSON que você tocar continuam válidos (sintaxe JSON correta).
          claude_args: |
            --max-turns 25

      - name: Publicar alterações
        run: |
          git config user.name "plano-alimentar-bot"
          git config user.email "actions@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git add data/ historico/
          git diff --cached --quiet || git commit -m "Atualização semanal automática: novo cardápio e mensagem motivacional"
          git push origin HEAD:main
          git push
